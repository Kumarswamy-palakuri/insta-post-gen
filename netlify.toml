[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API requests route to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

